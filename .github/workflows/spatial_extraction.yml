name: ERA5 Spatial Extraction Pipeline

on:
  workflow_dispatch:

jobs:

  process-tanzania:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Spatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev \
            libudunits2-dev

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R Packages with pak
        run: |
          Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org/")'
          Rscript -e 'pak::pkg_install(c("googledrive", "terra", "exactextractr", "sf", "geodata", "dplyr", "tidyr", "lubridate"))'

      - name: Decode Token & Run Tanzania Script
        env:
          ENCODED_TOKEN: ${{ secrets.GDRIVE_PERSONAL }}
        run: |
          export GDRIVE_AUTH_TOKEN=$(echo "$ENCODED_TOKEN" | base64 --decode)
          Rscript scripts/tanzania_pipeline.R

  process-malawi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Spatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev \
            libudunits2-dev

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R Packages with pak
        run: |
          Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org/")'
          Rscript -e 'pak::pkg_install(c("googledrive", "terra", "exactextractr", "sf", "geodata", "dplyr", "tidyr", "lubridate"))'

      - name: Decode Token & Run Malawi Script
        env:
          ENCODED_TOKEN: ${{ secrets.GDRIVE_PERSONAL }}
        run: |
          export GDRIVE_AUTH_TOKEN=$(echo "$ENCODED_TOKEN" | base64 --decode)
          Rscript scripts/malawi_pipeline.R
