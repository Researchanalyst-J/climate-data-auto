name: Auto-Download ERA5 to Google Drive

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2

      - name: Install System Rules
        run: sudo apt-get install -y libnetcdf-dev libcurl4-openssl-dev

      - name: Install R Packages
        run: Rscript -e "install.packages(c('ecmwfr', 'googledrive'))"

      - name: Run Script
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: Rscript download_era5.R
