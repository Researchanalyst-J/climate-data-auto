name: Auto-Download ERA5 to Drive

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Gives you the manual play button

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2

      - name: Install System Rules
        run: sudo apt-get install -y libnetcdf-dev libcurl4-openssl-dev

      - name: Install R Packages
        run: Rscript -e "install.packages(c('ecmwfr', 'googledrive'))"

      - name: Make Copernicus Key File
        # This matches the exact text you pasted earlier! No UID needed.
        run: |
          echo "url: https://cds.climate.copernicus.eu/api" > ~/.cdsapirc
          echo "key: ${{ secrets.CDS_API_KEY }}" >> ~/.cdsapirc

      - name: Make Google Drive Key File
        run: echo '${{ secrets.GDRIVE_JSON }}' > gdrive_key.json

      - name: Run Script
        run: Rscript download_era5.R
