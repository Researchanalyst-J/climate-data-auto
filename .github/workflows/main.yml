name: Auto-Download ERA5 to Google Drive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install System Rules
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R Packages with pak
        run: |
          Rscript -e 'install.packages("pak", repos="https://cloud.r-project.org/")'
          Rscript -e 'pak::pkg_install(c("ecmwfr", "googledrive"))'

      - name: Run Script
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          GDRIVE_CONFIG: ${{ secrets.GDRIVE_JSON }}
        run: |
          # Create the folder and the token file from your Secret
          mkdir -p gdrive_token
          echo "$GDRIVE_CONFIG" > gdrive_token/token_file
          
          # Force R to authenticate using the path before running the main script
          Rscript -e 'googledrive::drive_auth(path = "gdrive_token/token_file")'
          
          # Run your script
          Rscript download_era5.R
