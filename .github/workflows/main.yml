name: ERA5 Auto-Downloader

on:
  schedule:
    - cron: '0 */8 * * *' # Wakes up every 8 hours
  workflow_dispatch:      # Gives you a button to click to start it manually

jobs:
  download-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install System Dependencies for NetCDF
        run: sudo apt-get install -y libnetcdf-dev libcurl4-openssl-dev

      - name: Setup CDS API credentials
        # This writes the exact text you provided into the server
        run: |
          echo "url: https://cds.climate.copernicus.eu/api" > ~/.cdsapirc
          echo "key: ${{ secrets.CDS_API_KEY }}" >> ~/.cdsapirc

      - name: Run Download Script
        run: Rscript download_era5.R

      - name: Save Data to GitHub
        run: |
          git config --global user.name "DataBot"
          git config --global user.email "bot@github.com"
          git add *.nc
          git commit -m "Downloaded new 4-year batch" || echo "No new data to save"
          git push
